<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  body { font-family: sans-serif; font-size: 17px; }
  #topbar { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; border-bottom: 1px solid #ddd; }
  #topbar button { height: 36px; min-width: 44px; border: 1px solid #bbb; border-radius: 8px; background: #fff; font-size: 18px; padding: 0 10px; }
  #topbar button.on { background: #d0e4ff; border-color: #1976d2; }
  #title { display: block; box-sizing: border-box; width: 100%; border: none; border-bottom: 1px solid #ddd; outline: none; font-size: 22px; font-weight: bold; padding: 10px 12px; font-family: sans-serif; }
  #ed { box-sizing: border-box; height: 300px; overflow-y: auto; padding: 12px 12px 60px 12px; outline: none; }
  input[type=checkbox] { width: 20px; height: 20px; vertical-align: middle; margin-right: 8px; }

  #bar { display: none; position: fixed; right: 8px; top: 48px; width: 240px; max-height: 400px; overflow-y: auto; background: #fff; border: 1px solid #bbb; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); z-index: 10; padding: 4px 0; }
  #bar.open { display: block; }
  #bar .item { display: block; width: 100%; text-align: left; border: none; background: transparent; padding: 12px 14px; font-size: 16px; font-family: sans-serif; color: #000; }
  #bar .item:active { background: #e6e6e6; }
  #bar .ic { display: inline-block; width: 30px; text-align: center; margin-right: 8px; }
  #bar .sep { height: 1px; background: #ddd; margin: 4px 0; }
  #bar .lbl { font-size: 13px; color: #777; padding: 8px 14px 2px 14px; }
  #bar .row { display: flex; gap: 12px; padding: 6px 14px 10px 14px; }
  #bar .sw { width: 32px; height: 32px; border: 1px solid #777; border-radius: 50%; padding: 0; font-size: 14px; color: #000; }
  #bar .sw.hl { border-radius: 6px; }
</style>
</head>
<body>
<div id="topbar">
  <button data-c="menu">☰</button>
  <button id="fmt" data-c="toggle">Аа</button>
</div>
<div id="bar">
  <button class="item" data-c="bold"><span class="ic"><b>B</b></span>Жирный</button>
  <button class="item" data-c="italic"><span class="ic"><i>I</i></span>Курсив</button>
  <button class="item" data-c="underline"><span class="ic"><u>U</u></span>Подчёркнутый</button>
  <button class="item" data-c="strikeThrough"><span class="ic"><s>S</s></span>Зачёркнутый</button>
  <div class="sep"></div>
  <button class="item" data-c="formatBlock" data-v="H1"><span class="ic">H1</span>Заголовок 1</button>
  <button class="item" data-c="formatBlock" data-v="H2"><span class="ic">H2</span>Заголовок 2</button>
  <button class="item" data-c="formatBlock" data-v="P"><span class="ic">¶</span>Обычный текст</button>
  <div class="sep"></div>
  <button class="item" data-c="insertUnorderedList"><span class="ic">•</span>Маркированный список</button>
  <button class="item" data-c="insertOrderedList"><span class="ic">1.</span>Нумерованный список</button>
  <button class="item" data-c="check"><span class="ic">☑</span>Чек-лист</button>
  <div class="sep"></div>
  <button class="item" data-c="indent"><span class="ic">→</span>Отступ больше</button>
  <button class="item" data-c="outdent"><span class="ic">⇤</span>Отступ меньше</button>
  <div class="sep"></div>
  <div class="lbl">Цвет текста</div>
  <div class="row">
    <button class="sw" data-c="foreColor" data-v="#000000" style="background:#000000"></button>
    <button class="sw" data-c="foreColor" data-v="#d32f2f" style="background:#d32f2f"></button>
    <button class="sw" data-c="foreColor" data-v="#1976d2" style="background:#1976d2"></button>
    <button class="sw" data-c="foreColor" data-v="#388e3c" style="background:#388e3c"></button>
    <button class="sw" data-c="foreColor" data-v="#f57c00" style="background:#f57c00"></button>
  </div>
  <div class="lbl">Маркер</div>
  <div class="row">
    <button class="sw hl" data-c="hiliteColor" data-v="#fff176" style="background:#fff176"></button>
    <button class="sw hl" data-c="hiliteColor" data-v="#a5d6a7" style="background:#a5d6a7"></button>
    <button class="sw hl" data-c="hiliteColor" data-v="#f8bbd0" style="background:#f8bbd0"></button>
    <button class="sw hl" data-c="hiliteColor" data-v="transparent" style="background:#ffffff">✕</button>
  </div>
</div>
<input id="title" type="text" placeholder="Заголовок" autocomplete="off">
<div id="ed" contenteditable="true"></div>
<script>
  var ed = document.getElementById('ed');
  var bar = document.getElementById('bar');
  var topbar = document.getElementById('topbar');
  var fmt = document.getElementById('fmt');
  var title = document.getElementById('title');
  var timer = null;
  var current = Android.title();
  title.value = current;

  function fit() {
    var h = window.innerHeight - topbar.offsetHeight - title.offsetHeight;
    ed.style.height = Math.max(h, 150) + 'px';
    bar.style.top = (topbar.offsetHeight + 2) + 'px';
    bar.style.maxHeight = Math.max(window.innerHeight - topbar.offsetHeight - 12, 120) + 'px';
  }

  function closeMenu() {
    bar.classList.remove('open');
    fmt.classList.remove('on');
  }

  function commitTitle() {
    if (title.value.trim() === current) return;
    var r = Android.rename(title.value);
    current = r;
    title.value = r;
  }

  function fullDoc() {
    return '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>' + ed.innerHTML + '</body></html>';
  }
  function flush() { clearTimeout(timer); commitTitle(); Android.save(fullDoc()); }
  function later() { clearTimeout(timer); timer = setTimeout(flush, 500); }

  document.execCommand('styleWithCSS', false, true);
  var saved = Android.load();
  if (saved) {
    ed.innerHTML = new DOMParser().parseFromString(saved, 'text/html').body.innerHTML;
  }

  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  setTimeout(fit, 300);
  ed.addEventListener('focus', function () { setTimeout(fit, 400); });

  title.addEventListener('blur', commitTitle);
  title.addEventListener('focus', closeMenu);
  title.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); commitTitle(); ed.focus(); }
  });

  ed.addEventListener('pointerdown', closeMenu);
  ed.addEventListener('input', later);
  ed.addEventListener('click', function (e) {
    if (e.target.type === 'checkbox') {
      if (e.target.checked) e.target.setAttribute('checked', '');
      else e.target.removeAttribute('checked');
      later();
    }
  });

  bar.addEventListener('mousedown', function (e) { e.preventDefault(); });
  topbar.addEventListener('mousedown', function (e) { e.preventDefault(); });

  topbar.addEventListener('click', function (e) {
    var b = e.target.closest('[data-c]');
    if (!b) return;
    if (b.dataset.c === 'menu') { flush(); closeMenu(); ed.blur(); title.blur(); Android.openMenu(); return; }
    if (b.dataset.c === 'toggle') {
      var open = bar.classList.toggle('open');
      fmt.classList.toggle('on', open);
      fit();
    }
  });

  bar.addEventListener('click', function (e) {
    var b = e.target.closest('[data-c]');
    if (!b) return;
    ed.focus();
    if (b.dataset.c === 'check') {
      document.execCommand('insertHTML', false, '<div><input type="checkbox">&nbsp;</div>');
    } else {
      document.execCommand(b.dataset.c, false, b.dataset.v || null);
    }
    later();
  });
</script>
</body>
</html>
