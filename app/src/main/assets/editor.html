<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style id="docstyle">
  h1 { font-size: 1.6em; margin: 0.4em 0; }
  h2 { font-size: 1em; font-weight: bold; margin: 0.4em 0; }
  p { margin: 0; }
  pre { font-family: monospace; font-size: 0.95em; margin: 0; white-space: pre-wrap; }
  img { max-width: 100%; height: auto; border-radius: 6px; display: block; margin: 6px 0; }
  a { color: inherit; }
  .att { margin: 6px 0; }
  .att audio { width: 100%; display: block; }
  .attc { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid rgba(128,128,128,0.45); border-radius: 10px; text-decoration: none; color: inherit; }
  .attn { flex: 1; min-width: 0; font-weight: 500; word-break: break-all; }
  .atts { color: #8a8a8a; font-size: 0.85em; white-space: nowrap; }
  blockquote:not([style]) { margin: 0; padding: 4px 0 4px 16px; box-shadow: inset 4px 0 0 rgba(128,128,128,0.55); border-radius: 2px; color: #8a8a8a; line-height: 1.55; }
  input[type=checkbox] { width: 20px; height: 20px; vertical-align: middle; margin-right: 8px; }
  .done { text-decoration: line-through; color: #8a8a8a; }
  ol.n1 { list-style-type: decimal; }
  ol.n2 { list-style-type: decimal; }
  ol.n2 > li::marker { content: counter(list-item) ") "; }
  ol.n3 { list-style-type: upper-roman; }
  ol.n4 { list-style-type: upper-alpha; }
  ol.n5 { list-style-type: lower-alpha; }
  ol.n6 { list-style-type: lower-alpha; }
  ol.n6 > li::marker { content: counter(list-item, lower-alpha) ") "; }
  ul.b1 { list-style-type: disc; }
  ul.b2 { list-style-type: circle; }
  ul.b3 { list-style-type: "– "; }
  ul.b4 { list-style-type: "> "; }
</style>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  body { font-family: sans-serif; font-size: 17px; }
  #topbar { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; border-bottom: 1px solid #ddd; }
  #topbar button { height: 36px; min-width: 44px; border: 1px solid #bbb; border-radius: 8px; background: #fff; color: #000; font-size: 18px; padding: 0; display: flex; align-items: center; justify-content: center; }
  #topbar button.on { background: #d0e4ff; border-color: #1976d2; }
  #title { display: block; box-sizing: border-box; width: 100%; border: none; border-bottom: 1px solid #ddd; outline: none; font-size: 22px; font-weight: bold; padding: 10px 12px; font-family: sans-serif; }
  #ed { box-sizing: border-box; height: 300px; overflow-y: auto; padding: 12px 12px 60px 12px; outline: none; }
  #busy { display: none; position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: rgba(0,0,0,0.78); color: #fff; padding: 8px 16px; border-radius: 16px; font-size: 14px; z-index: 20; max-width: 90%; text-align: center; }
  #rec { display: none; position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); align-items: center; gap: 12px; background: rgba(0,0,0,0.88); color: #fff; padding: 8px 12px; border-radius: 22px; font-size: 15px; z-index: 30; }
  #rec button { border: none; border-radius: 14px; padding: 7px 14px; font-size: 14px; color: #fff; font-family: sans-serif; }
  #recstop { background: #d32f2f; }
  #reccancel { background: #555; }
  .recdot { width: 10px; height: 10px; border-radius: 50%; background: #ff5252; }
  #spd { display: none; position: fixed; z-index: 40; background: #fff; border: 1px solid #bbb; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); padding: 4px; }
  #spd button { display: block; width: 100%; text-align: left; border: none; background: transparent; padding: 9px 22px 9px 16px; font-size: 16px; color: #000; border-radius: 8px; font-family: sans-serif; white-space: nowrap; }
  #spd button.on { font-weight: bold; background: #e8f0fe; }

  .ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; display: block; }
  #bar { display: none; position: fixed; right: 8px; top: 48px; box-sizing: border-box; width: 160px; max-height: 400px; overflow-y: auto; background: #fff; border: 1px solid #bbb; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); z-index: 10; padding: 6px; }
  #bar.open { display: block; }
  #bar.wide { width: min(264px, calc(100vw - 16px)); }
  .page { display: none; }
  .page.show { display: block; }
  #bar button { font-family: sans-serif; color: #000; }
  .row { display: flex; gap: 5px; margin-bottom: 5px; }
  .row:last-child { margin-bottom: 0; }
  .btn { flex: 1; min-width: 0; height: 36px; border: 1px solid #ccc; border-radius: 8px; background: #f7f7f7; display: flex; align-items: center; justify-content: center; font-size: 16px; padding: 0; }
  .btn:active { background: #e0e0e0; }
  .btn.wide { flex: none; width: 100%; height: 44px; justify-content: flex-start; padding: 0 12px; margin-bottom: 5px; }
  .btn.wide:last-child { margin-bottom: 0; }
  .qs { display: flex; align-items: center; gap: 10px; color: #8a8a8a; font-size: 16px; }
  .qb { display: block; width: 4px; height: 24px; border-radius: 2px; background: rgba(128,128,128,0.55); flex: none; }
  .back { display: flex; align-items: center; width: 100%; height: 28px; border: none; background: transparent; color: #1976d2; padding: 0 2px; margin-bottom: 4px; }
  .back .ic { width: 20px; height: 20px; }
  .bt { font-size: 14px; font-weight: bold; margin-left: 2px; }
  .grid { display: flex; flex-wrap: wrap; gap: 5px; }
  .grid .btn { flex: none; }
  .c3 { width: calc((100% - 10px) / 3); }
  .c6 { width: calc((100% - 25px) / 6); font-size: 20px; }
  .dot { width: 20px; height: 20px; border-radius: 50%; border: 1px solid #777; box-sizing: border-box; }
  .dot.sq { border-radius: 5px; }
  .smp { display: inline-flex; align-items: baseline; font-size: 18px; line-height: 1; }
  .pr { width: 6px; height: 13px; margin-left: 1px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; overflow: visible; }
</style>
</head>
