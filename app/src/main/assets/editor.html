<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  body { font-family: sans-serif; font-size: 17px; }
  #topbar { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; border-bottom: 1px solid #ddd; }
  #topbar button { height: 36px; min-width: 44px; border: 1px solid #bbb; border-radius: 8px; background: #fff; font-size: 18px; padding: 0 10px; }
  #topbar button.on { background: #d0e4ff; border-color: #1976d2; }
  #dbg { font-size: 12px; color: #888; }
  #bar { display: none; flex-wrap: wrap; gap: 4px; padding: 6px; background: #f4f4f4; border-bottom: 1px solid #ccc; }
  #bar.open { display: flex; }
  #bar button { min-width: 36px; height: 36px; border: 1px solid #bbb; border-radius: 8px; background: #fff; font-size: 15px; padding: 0 6px; }
  #bar button.sw { min-width: 30px; width: 30px; height: 30px; margin-top: 3px; border: 1px solid #777; border-radius: 50%; padding: 0; }
  #bar button.hl { border-radius: 4px; }
  #ed { box-sizing: border-box; height: 300px; overflow-y: auto; padding: 12px 12px 60px 12px; outline: none; }
  input[type=checkbox] { width: 20px; height: 20px; vertical-align: middle; margin-right: 8px; }
</style>
</head>
<body>
<div id="topbar">
  <button data-c="menu">☰</button>
  <span id="dbg"></span>
  <button id="fmt" data-c="toggle">Аа</button>
</div>
<div id="bar">
  <button data-c="bold"><b>B</b></button>
  <button data-c="italic"><i>I</i></button>
  <button data-c="underline"><u>U</u></button>
  <button data-c="strikeThrough"><s>S</s></button>
  <button data-c="formatBlock" data-v="H1">H1</button>
  <button data-c="formatBlock" data-v="H2">H2</button>
  <button data-c="formatBlock" data-v="P">¶</button>
  <button data-c="insertUnorderedList">•</button>
  <button data-c="insertOrderedList">1.</button>
  <button data-c="check">☑</button>
  <button data-c="indent">→</button>
  <button data-c="outdent">⇤</button>
  <button class="sw" data-c="foreColor" data-v="#000000" style="background:#000000"></button>
  <button class="sw" data-c="foreColor" data-v="#d32f2f" style="background:#d32f2f"></button>
  <button class="sw" data-c="foreColor" data-v="#1976d2" style="background:#1976d2"></button>
  <button class="sw" data-c="foreColor" data-v="#388e3c" style="background:#388e3c"></button>
  <button class="sw" data-c="foreColor" data-v="#f57c00" style="background:#f57c00"></button>
  <button class="sw hl" data-c="hiliteColor" data-v="#fff176" style="background:#fff176"></button>
  <button class="sw hl" data-c="hiliteColor" data-v="#a5d6a7" style="background:#a5d6a7"></button>
  <button class="sw hl" data-c="hiliteColor" data-v="#f8bbd0" style="background:#f8bbd0"></button>
  <button class="sw hl" data-c="hiliteColor" data-v="transparent" style="background:#ffffff">✕</button>
</div>
<div id="ed" contenteditable="true"></div>
<script>
  var ed = document.getElementById('ed');
  var bar = document.getElementById('bar');
  var topbar = document.getElementById('topbar');
  var fmt = document.getElementById('fmt');
  var dbg = document.getElementById('dbg');
  var timer = null;

  function fit() {
    var used = topbar.offsetHeight + (bar.classList.contains('open') ? bar.offsetHeight : 0);
    var h = window.innerHeight - used;
    ed.style.height = Math.max(h, 150) + 'px';
    dbg.textContent = window.innerHeight + '/' + ed.clientHeight;
  }

  function fullDoc() {
    return '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>' + ed.innerHTML + '</body></html>';
  }
  function flush() { clearTimeout(timer); Android.save(fullDoc()); }
  function later() { clearTimeout(timer); timer = setTimeout(flush, 500); }

  document.execCommand('styleWithCSS', false, true);
  var saved = Android.load();
  if (saved) {
    ed.innerHTML = new DOMParser().parseFromString(saved, 'text/html').body.innerHTML;
  }

  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  setTimeout(fit, 300);
  ed.addEventListener('focus', function () { setTimeout(fit, 400); });

  ed.addEventListener('input', later);
  ed.addEventListener('click', function (e) {
    if (e.target.type === 'checkbox') {
      if (e.target.checked) e.target.setAttribute('checked', '');
      else e.target.removeAttribute('checked');
      later();
    }
  });

  bar.addEventListener('mousedown', function (e) { e.preventDefault(); });
  topbar.addEventListener('mousedown', function (e) { e.preventDefault(); });

  topbar.addEventListener('click', function (e) {
    var b = e.target.closest('[data-c]');
    if (!b) return;
    if (b.dataset.c === 'menu') { flush(); ed.blur(); Android.openMenu(); return; }
    if (b.dataset.c === 'toggle') {
      var open = bar.classList.toggle('open');
      fmt.classList.toggle('on', open);
      fit();
    }
  });

  bar.addEventListener('click', function (e) {
    var b = e.target.closest('[data-c]');
    if (!b) return;
    ed.focus();
    if (b.dataset.c === 'check') {
      document.execCommand('insertHTML', false, '<div><input type="checkbox">&nbsp;</div>');
    } else {
      document.execCommand(b.dataset.c, false, b.dataset.v || null);
    }
    later();
  });
</script>
</body>
</html>
