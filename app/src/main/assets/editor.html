<!DOCTYPE html>

<style id="docstyle">
  h1 { font-size: 1.6em; margin: 0.4em 0; }
  h2 { font-size: 1em; font-weight: bold; margin: 0.4em 0; }
  p { margin: 0; }
  pre { font-family: monospace; font-size: 0.95em; margin: 0; white-space: pre-wrap; }
  input[type=checkbox] { width: 20px; height: 20px; vertical-align: middle; margin-right: 8px; }
  .done { text-decoration: line-through; color: #8a8a8a; }
  ol.n1 { list-style-type: decimal; }
  ol.n2 { list-style-type: decimal; }
  ol.n2 > li::marker { content: counter(list-item) ") "; }
  ol.n3 { list-style-type: upper-roman; }
  ol.n4 { list-style-type: upper-alpha; }
  ol.n5 { list-style-type: lower-alpha; }
  ol.n6 { list-style-type: lower-alpha; }
  ol.n6 > li::marker { content: counter(list-item, lower-alpha) ") "; }
  ul.b1 { list-style-type: disc; }
  ul.b2 { list-style-type: circle; }
  ul.b3 { list-style-type: "– "; }
  ul.b4 { list-style-type: "> "; }
</style>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  body { font-family: sans-serif; font-size: 17px; }
  #topbar { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; border-bottom: 1px solid #ddd; }
  #topbar button { height: 36px; min-width: 44px; border: 1px solid #bbb; border-radius: 8px; background: #fff; color: #000; font-size: 18px; padding: 0; display: flex; align-items: center; justify-content: center; }
  #topbar button.on { background: #d0e4ff; border-color: #1976d2; }
  #title { display: block; box-sizing: border-box; width: 100%; border: none; border-bottom: 1px solid #ddd; outline: none; font-size: 22px; font-weight: bold; padding: 10px 12px; font-family: sans-serif; }
  #ed { box-sizing: border-box; height: 300px; overflow-y: auto; padding: 12px 12px 60px 12px; outline: none; }

  .ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; display: block; }
  #bar { display: none; position: fixed; right: 8px; top: 48px; box-sizing: border-box; width: 160px; max-height: 400px; overflow-y: auto; background: #fff; border: 1px solid #bbb; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); z-index: 10; padding: 6px; }
  #bar.open { display: block; }
  #bar.wide { width: min(264px, calc(100vw - 16px)); }
  .page { display: none; }
  .page.show { display: block; }
  #bar button { font-family: sans-serif; color: #000; }
  .row { display: flex; gap: 5px; margin-bottom: 5px; }
  .row:last-child { margin-bottom: 0; }
  .btn { flex: 1; min-width: 0; height: 36px; border: 1px solid #ccc; border-radius: 8px; background: #f7f7f7; display: flex; align-items: center; justify-content: center; font-size: 16px; padding: 0; }
  .btn:active { background: #e0e0e0; }
  .btn.wide { flex: none; width: 100%; height: 44px; justify-content: flex-start; padding: 0 12px; margin-bottom: 5px; }
  .btn.wide:last-child { margin-bottom: 0; }
  .back { display: flex; align-items: center; width: 100%; height: 28px; border: none; background: transparent; color: #1976d2; padding: 0 2px; margin-bottom: 4px; }
  .back .ic { width: 20px; height: 20px; }
  .bt { font-size: 14px; font-weight: bold; margin-left: 2px; }
  .grid { display: flex; flex-wrap: wrap; gap: 5px; }
  .grid .btn { flex: none; }
  .c3 { width: calc((100% - 10px) / 3); }
  .c6 { width: calc((100% - 25px) / 6); font-size: 20px; }
  .dot { width: 20px; height: 20px; border-radius: 50%; border: 1px solid #777; box-sizing: border-box; }
  .dot.sq { border-radius: 5px; }
  .smp { display: inline-flex; align-items: baseline; font-size: 18px; line-height: 1; }
  .pr { width: 6px; height: 13px; margin-left: 1px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; overflow: visible; }
</style>
</head>

<script>
  var ed = document.getElementById('ed');
  var bar = document.getElementById('bar');
  var topbar = document.getElementById('topbar');
  var fmt = document.getElementById('fmt');
  var title = document.getElementById('title');
  var timer = null;
  var stickBottom = false;
  var current = Android.title();
  title.value = current;

  var pages = ['main', 'ins', 'head', 'ol', 'ul', 'emoji', 'fc', 'hc'];
  var keep = { undo: 1, redo: 1, clear: 1, indent: 1, outdent: 1, bold: 1, italic: 1, underline: 1, strike: 1 };
  var BLK = 'div,p,h1,h2,h3,h4,h5,h6,li,blockquote,pre';
  var curPage = 'main';
  var curAnchor = null;

  function placeBar(anchor) {
    var minTop = topbar.offsetHeight + 2;
    bar.style.maxHeight = Math.max(window.innerHeight - minTop - 10, 120) + 'px';
    var top = (anchor === null) ? minTop : anchor;
    if (top < minTop) top = minTop;
    bar.style.top = top + 'px';
    var h = bar.offsetHeight;
    var maxTop = window.innerHeight - h - 8;
    if (top > maxTop) top = maxTop;
    if (top < minTop) top = minTop;
    bar.style.top = top + 'px';
  }

  function showPage(name) {
    curPage = name;
    for (var i = 0; i < pages.length; i++) {
      var p = document.getElementById('p-' + pages[i]);
      if (pages[i] === name) p.classList.add('show'); else p.classList.remove('show');
    }
    if (name === 'emoji' || name === 'head') bar.classList.add('wide'); else bar.classList.remove('wide');
    bar.scrollTop = 0;
    if (bar.classList.contains('open')) placeBar(name === 'main' ? null : curAnchor);
  }

  function openMenu() {
    curAnchor = null;
    showPage('main');
    bar.classList.add('open');
    fmt.classList.add('on');
    placeBar(null);
  }

  function closeMenu() {
    bar.classList.remove('open');
    fmt.classList.remove('on');
  }

  function resetScroll() {
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  }

  function fit() {
    resetScroll();
    var stick = stickBottom;
    var h = window.innerHeight - topbar.offsetHeight - title.offsetHeight;
    ed.style.height = Math.max(h, 150) + 'px';
    if (bar.classList.contains('open')) {
      placeBar(curPage === 'main' ? null : curAnchor);
    }
    if (stick) {
      ed.scrollTop = ed.scrollHeight;
    }
  }

  function refit() {
    fit();
    setTimeout(fit, 100);
    setTimeout(fit, 300);
    setTimeout(fit, 700);
  }

  function commitTitle() {
    if (title.value.trim() === current) return;
    var r = Android.rename(title.value);
    current = r;
    title.value = r;
  }

  function fullDoc() {
    var css = document.getElementById('docstyle').outerHTML;
    return '<!DOCTYPE html><html><head><meta charset="utf-8">' + css + '</head><body>' + ed.innerHTML + '</body></html>';
  }
  function flush() { clearTimeout(timer); commitTitle(); Android.save(fullDoc()); }
  function later() { clearTimeout(timer); timer = setTimeout(flush, 500); }

  function listEl(tag) {
    var s = window.getSelection();
    if (!s.rangeCount) return null;
    var n = s.anchorNode;
    var el = n ? (n.nodeType === 1 ? n : n.parentElement) : null;
    if (!el) return null;
    var l = el.closest(tag);
    return (l && ed.contains(l)) ? l : null;
  }

  function applyList(tag, cls, emoji) {
    var cmd = tag === 'ol' ? 'insertOrderedList' : 'insertUnorderedList';
    var l = listEl(tag);
    if (l) {
      var same = emoji
        ? l.style.listStyleType.indexOf(emoji) >= 0
        : (l.className === cls && !l.style.listStyleType);
      if (same) { document.execCommand(cmd); return; }
    } else {
      document.execCommand(cmd);
      l = listEl(tag);
    }
    if (l) {
      l.className = emoji ? '' : cls;
      l.style.listStyleType = emoji ? '"' + emoji + ' "' : '';
      if (!l.getAttribute('style')) l.removeAttribute('style');
      if (!l.getAttribute('class')) l.removeAttribute('class');
    }
  }

  function blockOf(n) {
    var el = n ? (n.nodeType === 1 ? n : n.parentElement) : null;
    var b = el ? el.closest(BLK) : null;
    return (b && b !== ed && ed.contains(b)) ? b : null;
  }

  function touchOnly(el, r) {
    if (r.collapsed) return false;
    var e = r.endContainer;
    if (!(e === el || el.contains(e))) return false;
    if (r.endOffset !== 0) return false;
    var pre = document.createRange();
    pre.setStart(el, 0);
    pre.setEnd(e, 0);
    return pre.toString() === '';
  }

  function selBlocks() {
    var sel = window.getSelection();
    var out = [];
    if (!sel.rangeCount) return out;
    var r = sel.getRangeAt(0);
    if (!ed.contains(r.commonAncestorContainer)) return out;
    if (r.collapsed) {
      var b = blockOf(r.startContainer);
      if (b) out.push(b);
      return out;
    }
    var all = ed.querySelectorAll(BLK);
    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      if (el.querySelector(BLK)) continue;
      if (!r.intersectsNode(el)) continue;
      if (touchOnly(el, r)) continue;
      out.push(el);
    }
    return out;
  }

  function leafBlocks() {
    var all = ed.querySelectorAll(BLK);
    var out = [];
    for (var i = 0; i < all.length; i++) {
      if (!all[i].querySelector(BLK)) out.push(all[i]);
    }
    return out;
  }

  function hasCheck(b) {
    var c = b.querySelector('input[type=checkbox]');
    if (!c) return false;
    var pre = document.createRange();
    pre.setStart(b, 0);
    pre.setEndBefore(c);
    return pre.toString().trim() === '';
  }

  function removeCheck(b) {
    var c = b.querySelector('input[type=checkbox]');
    if (!c) return;
    var sel = window.getSelection();
    var r = document.createRange();
    r.setStartBefore(c);
    var n = c.nextSibling;
    if (n && n.nodeType === 3 && /^[\u00a0 ]/.test(n.nodeValue)) r.setEnd(n, 1); else r.setEndAfter(c);
    sel.removeAllRanges();
    sel.addRange(r);
    document.execCommand('delete');
    b.classList.remove('done');
  }

  function cloneAddCheck(b) {
    var c = document.createElement('input');
    c.type = 'checkbox';
    b.insertBefore(document.createTextNode('\u00a0'), b.firstChild);
    b.insertBefore(c, b.firstChild);
  }

  function cloneRemoveCheck(b) {
    var c = b.querySelector('input[type=checkbox]');
    if (!c) return;
    var n = c.nextSibling;
    if (n && n.nodeType === 3 && /^[\u00a0 ]/.test(n.nodeValue)) {
      n.nodeValue = n.nodeValue.slice(1);
      if (!n.nodeValue) n.parentNode.removeChild(n);
    }
    c.parentNode.removeChild(c);
    b.classList.remove('done');
  }

  function isChecked(c) {
    return c.checked || c.hasAttribute('checked');
  }

  function syncChecks() {
    var boxes = ed.querySelectorAll('input[type=checkbox]');
    for (var i = 0; i < boxes.length; i++) {
      var b = blockOf(boxes[i]);
      if (!b) continue;
      if (isChecked(boxes[i])) b.classList.add('done'); else b.classList.remove('done');
    }
    var done = ed.querySelectorAll('.done');
    for (var j = 0; j < done.length; j++) {
      var c = done[j].querySelector('input[type=checkbox]');
      if (!c || !isChecked(c)) done[j].classList.remove('done');
    }
  }

  function unitOf(a, n) {
    while (n.parentNode !== a) n = n.parentNode;
    return n;
  }

  function pathFrom(root, node) {
    var p = [];
    while (node !== root) {
      var par = node.parentNode;
      p.unshift(Array.prototype.indexOf.call(par.childNodes, node));
      node = par;
    }
    return p;
  }

  function nodeAt(root, path) {
    var n = root;
    for (var i = 0; i < path.length; i++) n = n.childNodes[path[i]];
    return n;
  }

  function caretEnd(b) {
    var r = document.createRange();
    r.selectNodeContents(b);
    var last = b.lastChild;
    if (last && last.nodeType === 1 && last.tagName === 'BR') r.setEndBefore(last);
    r.collapse(false);
    return r;
  }

  function toggleCheck() {
    var sel = window.getSelection();
    if (!sel.rangeCount) return;
    var blocks = selBlocks();
    if (!blocks.length) {
      document.execCommand('formatBlock', false, 'div');
      blocks = selBlocks();
      if (!blocks.length) return;
    }
    var collapsed = sel.getRangeAt(0).collapsed;
    var leaves = leafBlocks();
    var firstIdx = leaves.indexOf(blocks[0]);
    var lastIdx = leaves.indexOf(blocks[blocks.length - 1]);

    var all = true;
    for (var i = 0; i < blocks.length; i++) {
      if (!hasCheck(blocks[i])) all = false;
    }

    var lastBlock = blocks[blocks.length - 1];
    var a = blocks[0];
    while (a && !a.contains(lastBlock)) a = a.parentNode;
    if (a === blocks[0]) a = a.parentNode;
    if (!a || !(a === ed || ed.contains(a))) a = ed;
    while (a !== ed && a.closest && a.closest('ul,ol')) {
      a = a.closest('ul,ol').parentNode;
    }
    if (!(a === ed || ed.contains(a))) a = ed;

    var u1 = unitOf(a, blocks[0]);
    var uN = unitOf(a, lastBlock);
    var units = [];
    for (var u = u1; u; u = u.nextSibling) {
      units.push(u);
      if (u === uN) break;
    }

    var wrap = document.createElement('div');
    for (var k = 0; k < units.length; k++) wrap.appendChild(units[k].cloneNode(true));

    for (var m = 0; m < blocks.length; m++) {
      var unit = unitOf(a, blocks[m]);
      var ui = units.indexOf(unit);
      if (ui < 0) continue;
      var b2 = nodeAt(wrap.childNodes[ui], pathFrom(unit, blocks[m]));
      if (!b2) continue;
      if (all) cloneRemoveCheck(b2);
      else if (!hasCheck(b2)) cloneAddCheck(b2);
    }

    var html = wrap.innerHTML;
    var rg = document.createRange();
    rg.setStartBefore(u1);
    rg.setEndAfter(uN);
    sel.removeAllRanges();
    sel.addRange(rg);
    document.execCommand('insertHTML', false, html);
    syncChecks();

    var now = leafBlocks();
    if (now.length === leaves.length && firstIdx >= 0 && lastIdx >= 0) {
      var rr;
      if (collapsed) {
        rr = caretEnd(now[firstIdx]);
      } else {
        rr = document.createRange();
        rr.setStart(now[firstIdx], 0);
        rr.setEnd(now[lastIdx], now[lastIdx].childNodes.length);
      }
      sel.removeAllRanges();
      sel.addRange(rr);
    }
  }

  function clearFormat() {
    var sel = window.getSelection();
    if (!sel.rangeCount) return;
    var saved = sel.getRangeAt(0).cloneRange();
    var blocks = selBlocks();
    for (var i = 0; i < blocks.length; i++) {
      if (hasCheck(blocks[i])) removeCheck(blocks[i]);
    }
    sel.removeAllRanges();
    sel.addRange(saved);
    document.execCommand('removeFormat');
    for (var n = 0; n < 4; n++) {
      var any = false;
      if (document.queryCommandState('insertUnorderedList')) { document.execCommand('insertUnorderedList'); any = true; }
      if (document.queryCommandState('insertOrderedList')) { document.execCommand('insertOrderedList'); any = true; }
      if (!any) break;
    }
    var after = selBlocks();
    var heading = false;
    for (var j = 0; j < after.length; j++) {
      if (/^(H[1-6]|PRE)$/.test(after[j].tagName)) heading = true;
    }
    if (heading) document.execCommand('formatBlock', false, 'P');
    syncChecks();
  }

  function run(a, v) {
    switch (a) {
      case 'undo': document.execCommand('undo'); break;
      case 'redo': document.execCommand('redo'); break;
      case 'clear': clearFormat(); break;
      case 'indent': document.execCommand('indent'); break;
      case 'outdent': document.execCommand('outdent'); break;
      case 'bold': document.execCommand('bold'); break;
      case 'italic': document.execCommand('italic'); break;
      case 'underline': document.execCommand('underline'); break;
      case 'strike': document.execCommand('strikeThrough'); break;
      case 'h': document.execCommand('formatBlock', false, v); break;
      case 'ol': applyList('ol', v, null); break;
      case 'ul': applyList('ul', v, null); break;
      case 'emoji': applyList('ul', '', v); break;
      case 'check': toggleCheck(); break;
      case 'fc': document.execCommand('foreColor', false, v); break;
      case 'hc': document.execCommand('hiliteColor', false, v); break;
      case 'ins':
        try { Android.insert(v); } catch (err) {}
        break;
    }
  }

  document.execCommand('styleWithCSS', false, true);
  var saved = Android.load();
  if (saved) {
    ed.innerHTML = new DOMParser().parseFromString(saved, 'text/html').body.innerHTML;
  }
  syncChecks();

  refit();
  window.addEventListener('resize', refit);
  window.addEventListener('load', refit);
  window.addEventListener('focus', refit);
  window.addEventListener('pageshow', refit);
  document.addEventListener('visibilitychange', refit);
  window.addEventListener('scroll', function () {
    if (window.scrollY || document.documentElement.scrollTop || document.body.scrollTop) resetScroll();
  });
  ed.addEventListener('scroll', function () {
    stickBottom = (ed.scrollHeight - ed.scrollTop - ed.clientHeight) < 40;
  });
  ed.addEventListener('focus', function () { setTimeout(fit, 400); });

  title.addEventListener('blur', commitTitle);
  title.addEventListener('focus', closeMenu);
  title.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); commitTitle(); ed.focus(); }
  });

  ed.addEventListener('pointerdown', closeMenu);
  ed.addEventListener('input', function () { syncChecks(); later(); });
  ed.addEventListener('click', function (e) {
    if (e.target.type === 'checkbox') {
      var c = e.target;
      if (c.checked) c.setAttribute('checked', ''); else c.removeAttribute('checked');
      syncChecks();
      later();
    }
  });

  bar.addEventListener('mousedown', function (e) { e.preventDefault(); });
  topbar.addEventListener('mousedown', function (e) { e.preventDefault(); });

  topbar.addEventListener('click', function (e) {
    var b = e.target.closest('[data-c]');
    if (!b) return;
    if (b.dataset.c === 'menu') { flush(); closeMenu(); ed.blur(); title.blur(); Android.openMenu(); return; }
    if (b.dataset.c === 'toggle') {
      if (bar.classList.contains('open')) closeMenu(); else openMenu();
      fit();
    }
  });

  bar.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.go) {
      var go = b.dataset.go;
      if (go === 'main') {
        curAnchor = null;
      } else if (curPage === 'main') {
        curAnchor = b.getBoundingClientRect().top - 38;
      }
      showPage(go);
      return;
    }
    var a = b.dataset.a;
    if (!a) return;
    ed.focus();
    run(a, b.dataset.v);
    later();
    if (!keep[a]) closeMenu();
  });
</script>
</body>
</html>
